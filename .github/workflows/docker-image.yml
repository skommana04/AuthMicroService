name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  
    build:
  
      runs-on: ubuntu-latest
  
      steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tag
        id: vars
        run: echo "TAG=latest-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t medhakommana/auth930:${{ env.TAG }} .

      - name: Push Docker image
        run: docker push medhakommana/auth930:${{ env.TAG }}

      - name: Image update
        run: |
           git clone https://github.com/skommana04/authdeploy.git
           sed -i "s|image:.*|image: medhakommana/auth930:${{ env.TAG }}|g" authdeploy/authms-deployment.yml

      - name: push the updated image in manifest files repo
        run: |
           cd authdeploy
           git add .
           git commit -m "image updated"
           git push origin master
